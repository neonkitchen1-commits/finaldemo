let cur=0;

function mix(a){return [...a].sort(()=>Math.random()-.5)}
function renderDays(){days.innerHTML=L.map((_,i)=>`<button class="day ${i===cur?'on':''}" data-i="${i}">${String(i+1).padStart(2,'0')}</button>`).join('');days.querySelectorAll('.day').forEach(b=>b.onclick=()=>{cur=+b.dataset.i;render()});requestAnimationFrame(()=>days.querySelector('.on')?.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'}))}
function wordQ(v,idx){const pool=mix(v.map(x=>x[1]).filter((_,i)=>i!==idx)).slice(0,2),ans=v[idx][1],opts=mix([ans,...pool]);return [`${v[idx][0]} 最接近：`,opts,opts.indexOf(ans)]}
function reverseQ(v,idx){const pool=mix(v.map(x=>x[0]).filter((_,i)=>i!==idx)).slice(0,2),ans=v[idx][0],opts=mix([ans,...pool]);return [`“${v[idx][1]}” 的英文：`,opts,opts.indexOf(ans)]}
function render(){renderDays();const d=L[cur],g=d[4].split('|'),go=g[1].split(','),qs=[wordQ(d[2],0),wordQ(d[2],3),reverseQ(d[2],5),[g[0],go,+g[2]]];center.textContent=`Day ${String(cur+1).padStart(2,'0')}`;prev.disabled=cur===0;next.disabled=cur===L.length-1;main.innerHTML=`<section class="hero"><div class="k">DAY ${String(cur+1).padStart(2,'0')}</div><h1>${d[0]}</h1><p>${d[1]}。每天一颗，打开就学，不打卡、不记录。</p></section><section class="card"><div class="head"><h2>01 · Words</h2><span class="mini">8 words</span></div><div class="words">${d[2].map(w=>`<button class="word" onclick="this.classList.toggle('show')"><div class="en">${w[0]}</div><div class="cn">${w[1]}</div><div class="tap">tap</div></button>`).join('')}</div><div class="hint">先自己想意思，再点开中文。</div></section><section class="card"><div class="head"><h2>02 · Grammar</h2><span class="mini">only useful</span></div><div class="grammar">${d[3]}</div></section><section class="card"><div class="head"><h2>03 · Speak like this</h2><span class="mini">tap 🔊</span></div><div class="chunks">${d[5].map(x=>`<div class="chunk"><button class="sound" data-s="${encodeURIComponent(x)}">🔊</button><span>${x}</span></div>`).join('')}</div></section><section class="card"><div class="head"><h2>04 · Quick Check</h2><span class="mini">4 questions</span></div><div class="quiz">${qs.map((q,qi)=>`<div class="q"><div class="qt">${qi+1}. ${q[0]}</div><div class="opts">${q[1].map((o,oi)=>`<button class="opt" data-ok="${oi===q[2]}">${String.fromCharCode(65+oi)} · ${o}</button>`).join('')}</div></div>`).join('')}</div></section><section class="card"><div class="head"><h2>05 · Say it</h2><span class="mini">1–2 min</span></div><div class="speak">${d[6]}</div></section>`;document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>say(decodeURIComponent(b.dataset.s)));document.querySelectorAll('.q').forEach(q=>{const os=[...q.querySelectorAll('.opt')];os.forEach(o=>o.onclick=()=>{os.forEach(x=>x.classList.remove('ok','no'));if(o.dataset.ok==='true')o.classList.add('ok');else{o.classList.add('no');os.find(x=>x.dataset.ok==='true')?.classList.add('ok')}})});scrollTo({top:0,behavior:'smooth'})}
prev.onclick=()=>{if(cur){cur--;render()}};next.onclick=()=>{if(cur<L.length-1){cur++;render()}};render();
</script></body></html>
